name: Scrape & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10,22 * * *"
  workflow_dispatch:

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Refresh jobs data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for scrapers)
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_BIN=$HOME/.cache/ms-playwright" >> $GITHUB_ENV

      - name: Scrape Indeed (refresh)
        env:
          HEADLESS: "1"
        run: node scripts/scrape-categories.mjs --refresh --max=6 --delay=700

      - name: Scrape LinkedIn (refresh)
        env:
          HEADLESS: "1"
        run: node scripts/scrape-linkedin-categories.mjs --refresh --max=5 --delay=600

      - name: Backfill logos
        env:
          HEADLESS: "1"
        run: node scripts/backfill-logos.mjs --par=4

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "chore: refresh job listings [skip ci]"
            git push
          fi
